server {
  listen       80;
  server_name  _;

  root   /usr/share/nginx/html;
  index  index.html;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; connect-src 'self' https://app.ticketmaster.com https://api.spotify.com https://accounts.spotify.com https://www.googleapis.com; frame-ancestors 'none'; img-src 'self' data: https:; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'" always;

  # Long-cache the fingerprinted assets Vite emits.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # SPA fallback: unknown routes return index.html so client-side routing works.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
